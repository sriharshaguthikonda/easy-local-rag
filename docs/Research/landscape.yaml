# Issue #10 retained-Chroma lexical and hybrid search
# Public sources returned HTTP 200 on 2026-11-27. Discarded sources: 0.
# Discovery terms: embedded sparse search, BM25 memory, disk-backed inverted
# index, hybrid rank fusion, local vector process safety, query-time snapshots.
# Decision: reuse SQLite FTS5 BM25 and Chroma's ID-constrained vector query.
# A synthetic 220,000-row FTS5 probe recovered a unique term using a 4 MiB
# SQLite page cache. A synthetic Chroma 1.0.16 probe confirmed query(ids=...)
# and showed that a warmed reader could return stale vectors after an outside
# update while a newly started reader returned the new ranking.
issue_010:
  - name: SQLite FTS5
    url: https://www.sqlite.org/fts5.html
    verified: live
    recheck_after: 2027-05-27
    decision: Reuse disk-backed full-corpus BM25 per capture.
  - name: rank_bm25
    url: https://raw.githubusercontent.com/dorianbrown/rank_bm25/master/rank_bm25.py
    verified: source
    recheck_after: 2027-05-27
    decision: Source keeps one in-memory frequency map per row. Retain for legacy paths while routing maintained hybrid search through FTS5.
  - name: Apache Lucene BM25Similarity
    url: https://raw.githubusercontent.com/apache/lucene/main/lucene/core/src/java/org/apache/lucene/search/similarities/BM25Similarity.java
    verified: source
    recheck_after: 2027-05-27
    decision: Source uses collection-length statistics and per-term IDF. Using the JVM engine would add a new runtime for a feature already available in SQLite.
  - name: Qdrant Hybrid Query
    url: https://qdrant.tech/documentation/hybrid-queries/
    verified: documentation
    recheck_after: 2027-05-27
    decision: Reuse the independent-prefetch and RRF pattern. The Qdrant backend requires another datastore.
  - name: Weaviate Hybrid Search
    url: https://docs.weaviate.io/weaviate/concepts/search/hybrid-search
    verified: documentation
    recheck_after: 2027-05-27
    decision: Comparable rank-fusion implementation on a different datastore.
  - name: OpenSearch Hybrid Search
    url: https://docs.opensearch.org/latest/vector-search/ai-search/hybrid-search/index/
    verified: documentation
    recheck_after: 2027-05-27
    decision: Search-pipeline fusion would require another service and index.

# Issue #22 discovery covered loaded-instance identity, native render/tokenize,
# raw completion, overflow policy, backend/gateway alternatives and local
# cancellation. GitHub repositories, code, issues and PRs, package listings,
# ecosyste.ms, Hacker News and the official MCP Registry were checked.
# The different vocabulary pass yielded existing SDK, engine, server and
# gateway approaches. One registry alias and one guessed source path failed
# HTTP verification and were discarded. No live generation is authorized here.
issue_022_lmstudio:
  - name: LM Studio TypeScript SDK
    url: https://github.com/lmstudio-ai/lmstudio-js/blob/0eca19214f508db23c0807598fcba63cb8ba7557/packages/lms-client/src/llm/LLMDynamicHandle.ts
    verified: source
    recheck_after: 2027-02-28
    decision: Reuse the official loaded-instance renderer, tokenizer and raw completion if current-runtime parity and cancellation are proven.
  - name: LM Studio Python SDK
    url: https://github.com/lmstudio-ai/lmstudio-python/blob/ae837ac5a55d6364a4c106e362939b1404f9c21d/src/lmstudio/json_api.py
    verified: source
    recheck_after: 2027-02-28
    decision: Released completion uses a passthrough template on the chat prediction path. The handle is addressed by mutable identifier. Recheck if a released SDK gains raw completion with instance binding.
  - name: llm-lmstudio
    url: https://github.com/llm-lmstudio/llm-lmstudio/blob/master/src/llm_lmstudio.py
    verified: source
    recheck_after: 2027-02-28
    decision: Useful as a gateway comparison. The REST transport has load operations and lacks the instance-bound SDK render and dispatch contract required here.
  - name: llama.cpp server
    url: https://github.com/ggml-org/llama.cpp/tree/master/tools/server
    verified: documentation
    recheck_after: 2027-02-28
    decision: Provides native server completion and tokenization for its own loaded model. Adopting the separate server would require another model load.
  - name: Ollama
    url: https://github.com/ollama/ollama/blob/v0.34.0/server/routes.go
    verified: source
    recheck_after: 2027-02-28
    decision: Preserve the maintained Ollama adapter. Ollama render and runner metadata describe an Ollama-owned runner.
  - name: LangChain OpenAI adapter
    url: https://github.com/langchain-ai/langchain/tree/master/libs/partners/openai
    verified: documentation
    recheck_after: 2027-02-28
    decision: OpenAI-compatible routing does not expose the native renderer, tokenizer or immutable loaded-instance reference needed by this integration.
  - name: vLLM server
    url: https://github.com/vllm-project/vllm/tree/main/vllm/entrypoints
    verified: documentation
    recheck_after: 2027-02-28
    decision: The serving API manages a separate engine. It does not address the resident LM Studio instance.
