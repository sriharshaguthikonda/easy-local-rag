name: Secret scan

on:
  pull_request:
    branches: [main, GUI-BM25-hyb-kkro-tkn-lmt-synms-mon-chngs-streamlit-chromadb-docs]
  push:
    branches: [main, GUI-BM25-hyb-kkro-tkn-lmt-synms-mon-chngs-streamlit-chromadb-docs]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the event commit
        run: |
          # Fetch the public repository without initializing submodules.
          git init
          git fetch --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan tracked files and incoming commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          snapshot=$(mktemp -d)
          git archive HEAD | tar -x -C "$snapshot"
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --ignore-gitleaks-allow --config .gitleaks.toml "$snapshot"
          history="$HEAD_SHA"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            history="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact=100 --ignore-gitleaks-allow --config .gitleaks.toml \
            --log-opts="$history" .
