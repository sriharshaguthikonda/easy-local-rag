name: Secret scan

on:
  pull_request:
    branches: [main, GUI-BM25-hyb-kkro-tkn-lmt-synms-mon-chngs-streamlit-chromadb-docs]
  push:
    branches: [main, GUI-BM25-hyb-kkro-tkn-lmt-synms-mon-chngs-streamlit-chromadb-docs]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan tracked files and incoming commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          snapshot=$(mktemp -d)
          git archive HEAD | tar -x -C "$snapshot"
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --ignore-gitleaks-allow --config .gitleaks.toml "$snapshot"
          if [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            "$RUNNER_TEMP/gitleaks" git --redact=100 --ignore-gitleaks-allow --config .gitleaks.toml \
              --log-opts="$BASE_SHA..$HEAD_SHA" .
          fi
